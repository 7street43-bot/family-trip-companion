<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f6f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="雙寶出遊" />
  <meta name="description" content="雙寶出遊小幫手 4.5.0-phase1.2｜Family Trip Companion PWA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css?v=4.5.0-phase1.2" />
  <title>雙寶出遊小幫手 4.5.0-phase1.2</title>
</head>
<body>
  <div id="app-shell">
    <header class="app-header" id="appHeader">
      <div class="brand-wrap">
        <div class="brand-mark" id="brandMark" aria-hidden="true">🐻</div>
        <div>
          <div class="brand-title" id="brandTitle">雙寶出遊</div>
          <div class="brand-subtitle" id="brandSubtitle">家庭出遊小幫手 4.5.0-phase1.2</div>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="設定" title="設定">⚙︎</button>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="主要導覽">
      <button data-view="home" class="nav-item active" aria-label="首頁"><span>⌂</span><b>首頁</b></button>
      <button data-view="explore" class="nav-item" aria-label="探索"><span>⌕</span><b>探索</b></button>
      <button data-view="trips" class="nav-item" aria-label="行程"><span>▣</span><b>行程</b></button>
      <button data-view="pack" class="nav-item" aria-label="外出包"><span>▢</span><b>外出包</b></button>
    </nav>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="snackbar" class="snackbar" hidden></div>
  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden />

  <script src="./db.js?v=4.5.0-phase1.2"></script>
  <script src="./cloud-sync.js?v=4.5.0-phase1.2"></script>
  <script src="./app.js?v=4.5.0-phase1.2"></script>
</body>
</html>
