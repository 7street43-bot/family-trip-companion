name: Repository Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-obsolete-branches:
    if: contains(github.event.head_commit.message, '[repo-maintenance]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete safety branches
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            preview-policy
            preview-qa
            preview-safe
            preview-safety-work
            safety-baseline
          )
          for branch in "${obsolete[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "deleted: $branch"
            else
              echo "already absent: $branch"
            fi
          done

      - name: Verify required branches remain
        shell: bash
        run: |
          set -euo pipefail
          for branch in main preview rollback/v4.5.0-phase1.2; do
            git ls-remote --exit-code --heads origin "$branch" >/dev/null
            echo "kept: $branch"
          done
