name: Preview Safety Gate

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime files are unchanged from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          forbidden_changes=$(git diff --name-only origin/main...HEAD -- \
            public/app.js public/app.css public/index.html public/db.js public/cloud-sync.js public/sw.js public/manifest.webmanifest public/version.json netlify netlify.toml supabase || true)
          if [ -n "$forbidden_changes" ]; then
            echo "Runtime or backend files changed unexpectedly:"
            echo "$forbidden_changes"
            exit 1
          fi

      - name: Static syntax and JSON checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/db.js
          node --check public/cloud-sync.js
          node --check public/sw.js
          for f in netlify/functions/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('public/version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/seed-data.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/decision-metadata.json','utf8'))"

      - name: Production runtime smoke check
        shell: bash
        run: |
          set -euo pipefail
          base='https://comfy-heliotrope-475c71.netlify.app'
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 30 "$base/version.json" -o version-live.json
          node -e "const v=require('./version-live.json'); if(v.version!=='4.5.0-phase1.2') { console.error(v); process.exit(1) }"
          for p in / /manifest.webmanifest '/app.css?v=4.5.0-phase1.2' '/app.js?v=4.5.0-phase1.2'; do
            code=$(curl --connect-timeout 5 --max-time 30 --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$base$p")
            test "$code" = "200" || { echo "$p -> $code"; exit 1; }
          done

      - name: Realistic cold-load stress test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import statistics
          import time
          import urllib.request

          BASE = 'https://comfy-heliotrope-475c71.netlify.app'
          PATHS = [
              '/',
              '/version.json',
              '/manifest.webmanifest',
              '/app.css?v=4.5.0-phase1.2',
              '/app.js?v=4.5.0-phase1.2',
          ]
          SESSIONS = 25
          CONCURRENCY = 5
          TIMEOUT = 30

          def load_session(session_id):
              rows = []
              for path in PATHS:
                  req = urllib.request.Request(
                      BASE + path,
                      headers={
                          'User-Agent': 'FamilyTripPreviewSafetyGate/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  started = time.perf_counter()
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                      body = response.read()
                      elapsed = time.perf_counter() - started
                      if response.status != 200:
                          raise RuntimeError(f'session={session_id} path={path} status={response.status}')
                      if not body:
                          raise RuntimeError(f'session={session_id} path={path} empty-body')
                      rows.append((path, elapsed, len(body)))
              return rows

          all_rows = []
          failures = []
          started_all = time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as pool:
              futures = {pool.submit(load_session, i): i for i in range(1, SESSIONS + 1)}
              for future in concurrent.futures.as_completed(futures):
                  sid = futures[future]
                  try:
                      all_rows.extend(future.result())
                  except Exception as exc:
                      failures.append((sid, repr(exc)))

          wall = time.perf_counter() - started_all
          if failures:
              print('FAILURES:')
              for item in failures:
                  print(item)
              raise SystemExit(1)

          latencies = sorted(row[1] for row in all_rows)
          p50 = statistics.median(latencies)
          p95 = latencies[max(0, int(len(latencies) * 0.95) - 1)]
          max_latency = max(latencies)
          total_bytes = sum(row[2] for row in all_rows)

          print(f'requests={len(all_rows)} sessions={SESSIONS} concurrency={CONCURRENCY}')
          print(f'wall_seconds={wall:.3f} total_bytes={total_bytes}')
          print(f'p50_seconds={p50:.3f} p95_seconds={p95:.3f} max_seconds={max_latency:.3f}')

          if len(all_rows) != SESSIONS * len(PATHS):
              raise SystemExit('request-count-mismatch')
          if p95 > 5.0:
              raise SystemExit(f'p95-too-slow:{p95:.3f}s')
          if max_latency > 15.0:
              raise SystemExit(f'max-too-slow:{max_latency:.3f}s')
          PY

      - name: Gate result
        run: echo 'PREVIEW SAFETY REALISTIC LOAD GATE = PASS'
