name: Preview Safety Gate

on:
  push:
    branches: [preview]
  workflow_dispatch:

concurrency:
  group: preview-safety-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime files are unchanged from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          forbidden_changes=$(git diff --name-only origin/main...HEAD -- \
            public/app.js public/app.css public/index.html public/db.js public/cloud-sync.js public/sw.js public/manifest.webmanifest public/version.json netlify netlify.toml supabase || true)
          if [ -n "$forbidden_changes" ]; then
            echo "Runtime or backend files changed unexpectedly:"
            echo "$forbidden_changes"
            exit 1
          fi

      - name: Static syntax and JSON checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/db.js
          node --check public/cloud-sync.js
          node --check public/sw.js
          for f in netlify/functions/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('public/version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/seed-data.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/decision-metadata.json','utf8'))"

      - name: Production runtime smoke check
        shell: bash
        run: |
          set -euo pipefail
          base='https://comfy-heliotrope-475c71.netlify.app'
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$base/version.json" -o version-live.json
          node -e "const v=require('./version-live.json'); if(v.version!=='4.5.0-phase1.2') { console.error(v); process.exit(1) }"
          for p in / /manifest.webmanifest '/app.css?v=4.5.0-phase1.2' '/app.js?v=4.5.0-phase1.2'; do
            code=$(curl --connect-timeout 10 --max-time 30 --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$base$p")
            test "$code" = "200" || { echo "$p -> $code"; exit 1; }
          done

      - name: Wait for preview branch deploy to become stable
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          paths=(
            '/'
            '/version.json'
            '/manifest.webmanifest'
            '/app.css?v=4.5.0-phase1.2'
            '/app.js?v=4.5.0-phase1.2'
          )

          consecutive=0
          for attempt in $(seq 1 30); do
            sweep_ok=1
            for p in "${paths[@]}"; do
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 1 --retry-all-errors --retry-delay 1 \
                -o /tmp/preview-check "$base$p"; then
                sweep_ok=0
                break
              fi
            done

            if [ "$sweep_ok" = "1" ]; then
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 1 --retry-all-errors --retry-delay 1 \
                "$base/version.json" -o preview-version.json \
                && node -e "const v=require('./preview-version.json'); process.exit(v.version==='4.5.0-phase1.2'?0:1)"; then
                consecutive=$((consecutive+1))
                echo "stable sweep $consecutive/3"
              else
                consecutive=0
              fi
            else
              consecutive=0
            fi

            if [ "$consecutive" -ge 3 ]; then
              echo 'Preview branch deploy is stable across 3 consecutive full-asset sweeps.'
              break
            fi
            sleep 5
          done

          test "$consecutive" -ge 3 || { echo 'Preview branch deploy did not stabilize'; exit 1; }
          sleep 5

      - name: Preview browser-like cold-load stress test
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          rm -rf stress-times
          mkdir stress-times

          run_session() {
            set -euo pipefail
            sid="$1"
            started=$(date +%s%3N)
            curl --fail --fail-early --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -A 'FamilyTripPreviewSafetyGate/1.1' \
              -o /dev/null "$base/" \
              -o /dev/null "$base/version.json" \
              -o /dev/null "$base/manifest.webmanifest" \
              -o /dev/null "$base/app.css?v=4.5.0-phase1.2" \
              -o /dev/null "$base/app.js?v=4.5.0-phase1.2"
            ended=$(date +%s%3N)
            echo $((ended-started)) > "stress-times/$sid.ms"
          }
          export -f run_session
          export base

          seq 1 25 | xargs -I{} -P5 bash -c 'set -euo pipefail; run_session "$1"' _ {}

          python3 - <<'PY'
          from pathlib import Path
          import statistics

          vals = sorted(int(p.read_text().strip()) for p in Path('stress-times').glob('*.ms'))
          if len(vals) != 25:
              raise SystemExit(f'session-count-mismatch:{len(vals)}')
          p50 = statistics.median(vals)
          p95 = vals[max(0, int(len(vals) * 0.95) - 1)]
          maxv = max(vals)
          print(f'sessions=25 concurrency=5 p50_ms={p50:.0f} p95_ms={p95} max_ms={maxv}')
          if p95 > 10000:
              raise SystemExit(f'p95-session-too-slow:{p95}ms')
          if maxv > 15000:
              raise SystemExit(f'max-session-too-slow:{maxv}ms')
          PY

      - name: Production runtime recheck
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base='https://comfy-heliotrope-475c71.netlify.app'
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$base/version.json" -o version-live-after.json
          node -e "const v=require('./version-live-after.json'); if(v.version!=='4.5.0-phase1.2') { console.error(v); process.exit(1) }"

      - name: Gate result
        run: echo 'PREVIEW FIXED BRANCH DEPLOY + LOAD GATE = PASS'
