name: Rollback Runtime Isolation Dry Run

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  rollback-isolation-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate runtime-only rollback and prove governance isolation
        shell: bash
        run: |
          set -euo pipefail

          hash_tree() {
            local path="$1"
            if [ -e "$path" ]; then
              find "$path" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
            else
              printf 'ABSENT'
            fi
          }

          github_before=$(hash_tree .github)
          supabase_before=$(hash_tree supabase)
          netlify_toml_before=$(sha256sum netlify.toml | awk '{print $1}')
          guard_before=$(sha256sum scripts/netlify-deploy-guard.mjs | awk '{print $1}')

          # Build a synthetic rollback target locally. It deliberately changes only runtime.
          git config user.name 'rollback-dryrun'
          git config user.email 'rollback-dryrun@example.invalid'
          target_branch="synthetic-old-runtime"
          git checkout -b "$target_branch"
          node - <<'NODE'
          const fs = require('fs');
          const p = 'public/version.json';
          const v = JSON.parse(fs.readFileSync(p, 'utf8'));
          v.version = '0.0.0-rollback-dryrun';
          v.cache = 'rollback-dryrun';
          fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');
          NODE
          printf '\n/* rollback dry-run synthetic runtime */\n' >> public/app.css
          git add public/version.json public/app.css
          git commit -m 'synthetic old runtime for dry-run'
          target=$(git rev-parse HEAD)

          # Return to the real preview tree, then run the same runtime-only replacement shape.
          git checkout -
          for path in public netlify/functions; do
            git rm -r --ignore-unmatch "$path"
            if git cat-file -e "${target}:${path}" 2>/dev/null; then
              git checkout "$target" -- "$path"
            fi
          done
          git add -A public netlify/functions

          changed=$(git diff --cached --name-only)
          test -n "$changed" || { echo 'Expected a synthetic runtime diff but found none.'; exit 1; }
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(public/|netlify/functions/)' || true)
          test -z "$unexpected" || { echo "Rollback escaped runtime paths: $unexpected"; exit 1; }
          printf '%s\n' "$changed" | grep -q '^public/version.json$'

          github_after=$(hash_tree .github)
          supabase_after=$(hash_tree supabase)
          netlify_toml_after=$(sha256sum netlify.toml | awk '{print $1}')
          guard_after=$(sha256sum scripts/netlify-deploy-guard.mjs | awk '{print $1}')

          test "$github_before" = "$github_after" || { echo '.github changed during rollback dry-run'; exit 1; }
          test "$supabase_before" = "$supabase_after" || { echo 'supabase changed during rollback dry-run'; exit 1; }
          test "$netlify_toml_before" = "$netlify_toml_after" || { echo 'netlify.toml changed during rollback dry-run'; exit 1; }
          test "$guard_before" = "$guard_after" || { echo 'deploy guard changed during rollback dry-run'; exit 1; }

          echo 'ROLLBACK RUNTIME ISOLATION DRY RUN = PASS'
