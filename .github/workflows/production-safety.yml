name: Production Safety Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: Git ref or commit SHA whose runtime payload should be restored through preview
        required: true
        default: rollback/v4.5.0-phase1.2
      confirm:
        description: Type ROLLBACK to create the rollback candidate PR
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-safety-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require preview and explicit release authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "preview" || {
            echo "Only preview may be released to main. Got: ${{ github.head_ref }}"
            exit 1
          }
          title='${{ github.event.pull_request.title }}'
          [[ "$title" == *'[release-approved]'* ]] || {
            echo 'Release is not explicitly authorized. Add [release-approved] to the PR title only after owner approval.'
            exit 1
          }

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Candidate change policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          runtime_changes=$(git diff --name-only origin/main...HEAD -- public netlify/functions || true)
          backend_changes=$(git diff --name-only origin/main...HEAD -- netlify/functions || true)
          protected_changes=$(git diff --name-only origin/main...HEAD -- supabase netlify.toml scripts/netlify-deploy-guard.mjs .github/workflows || true)
          messages=$(git log --format=%B origin/main..HEAD || true)

          if [ -n "$runtime_changes" ]; then
            git diff --name-only origin/main...HEAD -- public/version.json | grep -q '^public/version.json$' || {
              echo 'Runtime changed but public/version.json was not updated.'
              exit 1
            }
          fi

          if [ -n "$backend_changes" ]; then
            printf '%s' "$messages" | grep -Fq '[backend-approved]' || {
              echo 'Backend files changed without [backend-approved] in the candidate commit range.'
              exit 1
            }
          fi

          if [ -n "$protected_changes" ]; then
            printf '%s' "$messages" | grep -Fq '[governance-approved]' || {
              echo 'Protected governance/data files changed without [governance-approved].'
              echo "$protected_changes"
              exit 1
            }
          fi

      - name: Static syntax and data checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/db.js
          node --check public/cloud-sync.js
          node --check public/sw.js
          for f in netlify/functions/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('public/version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/seed-data.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/decision-metadata.json','utf8'))"

      - name: Verify production still matches current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:public/version.json > expected-main-version.json
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            'https://comfy-heliotrope-475c71.netlify.app/version.json' -o live-production-version.json
          node - <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('expected-main-version.json','utf8')).version;
          const live = JSON.parse(fs.readFileSync('live-production-version.json','utf8')).version;
          if (expected !== live) {
            console.error({expected, live});
            process.exit(1);
          }
          console.log(`production baseline matches main: ${live}`);
          NODE

      - name: Wait for preview to match candidate and become stable
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          expected=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('public/version.json','utf8')).version)")
          paths=( '/' '/version.json' '/manifest.webmanifest' '/app.css' '/app.js' )
          consecutive=0
          for attempt in $(seq 1 36); do
            sweep_ok=1
            for p in "${paths[@]}"; do
              if ! curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 1 --retry-all-errors --retry-delay 1 \
                -o /dev/null "${base}${p}?release_gate=${GITHUB_SHA}"; then
                sweep_ok=0
                break
              fi
            done
            if [ "$sweep_ok" = "1" ]; then
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --retry 1 --retry-all-errors --retry-delay 1 \
                "${base}/version.json?release_gate=${GITHUB_SHA}" -o preview-version.json \
                && EXPECTED="$expected" node - <<'NODE'
          const fs = require('fs');
          const live = JSON.parse(fs.readFileSync('preview-version.json','utf8')).version;
          if (live !== process.env.EXPECTED) process.exit(1);
          NODE
              then
                consecutive=$((consecutive+1))
                echo "stable preview sweep ${consecutive}/3"
              else
                consecutive=0
              fi
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 3 ]; then break; fi
            sleep 5
          done
          test "$consecutive" -ge 3 || { echo 'Preview did not stabilize on the candidate version'; exit 1; }
          sleep 3

      - name: Preview browser-like load gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          rm -rf stress-times
          mkdir stress-times
          run_session() {
            set -euo pipefail
            sid="$1"
            started=$(date +%s%3N)
            curl --fail --fail-early --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -A 'FamilyTripReleaseGate/2.0' \
              -o /dev/null "$base/?gate=$GITHUB_SHA" \
              -o /dev/null "$base/version.json?gate=$GITHUB_SHA" \
              -o /dev/null "$base/manifest.webmanifest?gate=$GITHUB_SHA" \
              -o /dev/null "$base/app.css?gate=$GITHUB_SHA" \
              -o /dev/null "$base/app.js?gate=$GITHUB_SHA"
            ended=$(date +%s%3N)
            echo $((ended-started)) > "stress-times/$sid.ms"
          }
          export -f run_session
          export base GITHUB_SHA
          seq 1 25 | xargs -I{} -P5 bash -c 'set -euo pipefail; run_session "$1"' _ {}
          python3 - <<'PY'
          from pathlib import Path
          import statistics
          vals = sorted(int(p.read_text().strip()) for p in Path('stress-times').glob('*.ms'))
          if len(vals) != 25:
              raise SystemExit(f'session-count-mismatch:{len(vals)}')
          p50 = statistics.median(vals)
          p95 = vals[max(0, int(len(vals) * 0.95) - 1)]
          maxv = max(vals)
          print(f'sessions=25 concurrency=5 p50_ms={p50:.0f} p95_ms={p95} max_ms={maxv}')
          if p95 > 10000: raise SystemExit(f'p95-session-too-slow:{p95}ms')
          if maxv > 15000: raise SystemExit(f'max-session-too-slow:{maxv}ms')
          PY

      - name: Release gate result
        run: echo 'PRODUCTION RELEASE GATE = PASS'

  unauthorized-main-push-audit:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-approved]') && !contains(github.event.head_commit.message, '[skip netlify]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify fail-closed kept production on previous main runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          test "$before" != '0000000000000000000000000000000000000000'
          git cat-file -e "${before}^{commit}"
          git show "${before}:public/version.json" > before-version.json
          sleep 8
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            'https://comfy-heliotrope-475c71.netlify.app/version.json?failclosed='"$GITHUB_SHA" -o live.json
          node - <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('before-version.json','utf8')).version;
          const live = JSON.parse(fs.readFileSync('live.json','utf8')).version;
          if (expected !== live) {
            console.error({expectedPreviousMain: expected, live});
            process.exit(1);
          }
          console.log(`fail-closed production remained on previous runtime: ${live}`);
          NODE

  production-postdeploy:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Wait for production to match main
        shell: bash
        run: |
          set -euo pipefail
          base='https://comfy-heliotrope-475c71.netlify.app'
          expected=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('public/version.json','utf8')).version)")
          consecutive=0
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 1 --retry-all-errors --retry-delay 1 \
              "$base/version.json?postdeploy=${GITHUB_SHA}" -o production-version.json \
              && EXPECTED="$expected" node - <<'NODE'
          const fs = require('fs');
          const live = JSON.parse(fs.readFileSync('production-version.json','utf8')).version;
          if (live !== process.env.EXPECTED) process.exit(1);
          NODE
            then
              sweep_ok=1
              for p in / /manifest.webmanifest /app.css /app.js; do
                if ! curl --fail --silent --show-error --location \
                  --connect-timeout 10 --max-time 30 \
                  --retry 1 --retry-all-errors --retry-delay 1 \
                  -o /dev/null "${base}${p}?postdeploy=${GITHUB_SHA}"; then
                  sweep_ok=0
                  break
                fi
              done
              if [ "$sweep_ok" = "1" ]; then consecutive=$((consecutive+1)); else consecutive=0; fi
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 3 ]; then
              echo 'Production is stable and matches main.'
              break
            fi
            sleep 5
          done
          test "$consecutive" -ge 3 || { echo 'Production did not converge to main'; exit 1; }

      - name: Production browser-like load gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://comfy-heliotrope-475c71.netlify.app'
          rm -rf stress-times
          mkdir stress-times
          run_session() {
            set -euo pipefail
            sid="$1"
            started=$(date +%s%3N)
            curl --fail --fail-early --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -A 'FamilyTripProductionGate/2.0' \
              -o /dev/null "$base/?gate=$GITHUB_SHA" \
              -o /dev/null "$base/version.json?gate=$GITHUB_SHA" \
              -o /dev/null "$base/manifest.webmanifest?gate=$GITHUB_SHA" \
              -o /dev/null "$base/app.css?gate=$GITHUB_SHA" \
              -o /dev/null "$base/app.js?gate=$GITHUB_SHA"
            ended=$(date +%s%3N)
            echo $((ended-started)) > "stress-times/$sid.ms"
          }
          export -f run_session
          export base GITHUB_SHA
          seq 1 25 | xargs -I{} -P5 bash -c 'set -euo pipefail; run_session "$1"' _ {}
          test "$(find stress-times -type f | wc -l)" -eq 25

      - name: Production gate result
        run: echo 'PRODUCTION POST-DEPLOY GATE = PASS'

  automatic-rollback-pr:
    needs: production-postdeploy
    if: always() && github.event_name == 'push' && needs.production-postdeploy.result == 'failure' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create runtime-only rollback candidate PR into preview
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo 'Automatic rollback target is not an ancestor of main.'
            exit 1
          }
          branch="auto-rollback-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/preview
          for path in public netlify/functions; do
            git rm -r --ignore-unmatch "$path"
            if git cat-file -e "${TARGET_SHA}:${path}" 2>/dev/null; then
              git checkout "$TARGET_SHA" -- "$path"
            fi
          done
          git add -A public netlify/functions
          unexpected=$(git diff --cached --name-only | grep -Ev '^(public/|netlify/functions/)' || true)
          test -z "$unexpected" || { echo "Unexpected rollback paths: $unexpected"; exit 1; }
          if git diff --cached --quiet; then
            echo 'No runtime rollback diff to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Prepare runtime rollback to ${TARGET_SHA} [rollback-candidate]"
          git push origin "$branch"
          gh pr create \
            --base preview \
            --head "$branch" \
            --title "AUTO ROLLBACK candidate to ${TARGET_SHA:0:12}" \
            --body "Production post-deploy gate failed for ${GITHUB_SHA}. This PR restores only public/ and netlify/functions/ from previous main ${TARGET_SHA}; governance, Netlify deploy guard, Supabase, and user data are preserved. Merge into preview only. After Preview Safety Gate passes, create the normal preview → main release PR and require explicit release approval."

  manual-rollback-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit rollback confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = 'ROLLBACK' || {
            echo 'Confirmation must be exactly ROLLBACK.'
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target and create runtime-only rollback candidate PR into preview
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.rollback_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          if target=$(git rev-parse --verify "${REQUESTED_REF}^{commit}" 2>/dev/null); then
            :
          elif target=$(git rev-parse --verify "origin/${REQUESTED_REF}^{commit}" 2>/dev/null); then
            :
          else
            echo "Unable to resolve rollback ref: ${REQUESTED_REF}"
            exit 1
          fi
          git merge-base --is-ancestor "$target" origin/main || {
            echo 'Rollback target must be an ancestor of main.'
            exit 1
          }
          branch="manual-rollback-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/preview
          for path in public netlify/functions; do
            git rm -r --ignore-unmatch "$path"
            if git cat-file -e "${target}:${path}" 2>/dev/null; then
              git checkout "$target" -- "$path"
            fi
          done
          git add -A public netlify/functions
          unexpected=$(git diff --cached --name-only | grep -Ev '^(public/|netlify/functions/)' || true)
          test -z "$unexpected" || { echo "Unexpected rollback paths: $unexpected"; exit 1; }
          if git diff --cached --quiet; then
            echo 'Requested rollback target is already identical to preview runtime.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Prepare manual runtime rollback to ${target} [rollback-candidate]"
          git push origin "$branch"
          gh pr create \
            --base preview \
            --head "$branch" \
            --title "Manual rollback candidate to ${target:0:12}" \
            --body "Requested rollback ref: ${REQUESTED_REF}. Resolved target: ${target}. This PR restores only public/ and netlify/functions/; governance, Netlify deploy guard, Supabase, and user data remain untouched. Merge into preview only, verify Preview Safety Gate, then release preview → main after explicit approval."
