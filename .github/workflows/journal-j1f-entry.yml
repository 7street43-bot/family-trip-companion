name: Journal J1F Three Interface Entry

on:
  push:
    branches: [preview]
    paths:
      - 'public/journal-ui.mjs'
      - 'public/journal-shell.mjs'
      - 'public/app.js'
      - 'public/journal-yearly.mjs'
      - 'public/journal.css'
      - 'public/journal-browser.mjs'
      - 'public/index.html'
      - 'public/version.json'
      - 'public/sw.js'
      - 'netlify/functions/journal-gpt.mjs'
      - 'tests/journal-j1f-ui.test.mjs'
      - 'tests/j1k-journal-shell.test.mjs'
      - 'tests/journal-yearly.test.mjs'
      - 'tests/journal-gpt-gateway.test.mjs'
      - 'tests/journal-mcp-contract.test.mjs'
      - 'docs/JOURNAL_GPT_CONNECTOR.md'
      - '.github/workflows/journal-j1f-entry.yml'
  workflow_dispatch:

concurrency:
  group: journal-j1f-three-interface-entry
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Journal modules
        run: node scripts/prepare-site.mjs
      - name: Static checks
        run: |
          set -euo pipefail
          node --check public/journal-ui.mjs
          node --check public/journal-shell.mjs
          node --check public/app.js
          node --check public/journal-yearly.mjs
          node --check public/journal-browser.mjs
          node --check netlify/functions/journal-gpt.mjs
          node --check public/sw.js
          node --test tests/journal-j1f-ui.test.mjs
          node --test tests/j1k-journal-shell.test.mjs
          node --test tests/journal-yearly.test.mjs
          node --test tests/journal-gpt-gateway.test.mjs
          node --test tests/journal-mcp-contract.test.mjs
      - name: J1F interface invariants
        run: |
          set -euo pipefail
          grep -Fq 'journal-ui.mjs' public/index.html
          ! grep -Fq 'journal-yearly.mjs' public/index.html
          ! grep -Fq 'journal-media-preview-demo.mjs' public/index.html
          grep -Fq 'journal.css' public/index.html
          grep -Fq "QUEUE_KEY='journalJ1FQueue'" public/journal-ui.mjs
          grep -Fq 'Preview 安全模式不會寫入或排入正式日誌' public/journal-ui.mjs
          grep -Fq '@place:' public/journal-ui.mjs
          grep -Fq 'searchEntriesLocal' public/journal-ui.mjs
          grep -Fq '新增日誌' public/journal-ui.mjs
          grep -Fq 'data-journal-new' public/journal-ui.mjs
          grep -Fq 'data-journal-cancel-new' public/journal-ui.mjs
          grep -Fq 'data-journal-back' public/journal-ui.mjs
          grep -Fq 'composing:false' public/journal-ui.mjs
          ! grep -Fq 'data-journal-sync' public/journal-ui.mjs
          grep -Fq '.journal-panel:not(.has-selection) .journal-right' public/journal.css
          grep -Fq '.journal-panel.has-selection .journal-left' public/journal.css
          grep -Fq 'placeholder="搜尋日誌"' public/journal-ui.mjs
          grep -Fq '編輯日誌' public/journal-ui.mjs
          grep -Fq 'journalMediaSection' public/journal-ui.mjs
          ! grep -Fq 'data-journal-tab=' public/journal-ui.mjs
          ! grep -Fq 'data-journal-trip-memory' public/journal-ui.mjs
          ! grep -Fq 'data-journal-archive' public/journal-ui.mjs
          grep -Fq 'normalizeTripDraft' public/journal-ui.mjs
          grep -Fq 'name="tripRef"' public/journal-ui.mjs
          grep -Fq 'openDraft' public/journal-shell.mjs
          grep -Fq 'data-trip-journal-draft' public/app.js
          grep -Fq '整理今天回憶' public/app.js
          grep -Fq 'tripRef:trip?.id' public/app.js
          grep -Fq "source:'gpt'" netlify/functions/journal-gpt.mjs
          grep -Fq "journal_reserve_media" netlify/functions/journal-mcp.mjs
          grep -Fq "journal_finalize_media" netlify/functions/journal-mcp.mjs
          grep -Fq "journal_media_mutate" netlify/functions/journal-gpt.mjs
          ! grep -R "SERVICE_ROLE\|service_role" -n public/journal-ui.mjs public/journal-browser.mjs netlify/functions/journal-gpt.mjs
          node -e "const v=JSON.parse(require('fs').readFileSync('public/version.json')); if(!/^4\\.5\\.0-phase1\\./.test(v.version)) process.exit(1)"
      - name: Result
        run: echo 'J1F MOBILE-FIRST SIMPLE JOURNAL + DESKTOP + GPT CONTRACT = PASS'

  preview-smoke:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for fixed Preview deploy
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          expected=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('public/version.json','utf8')).version)")
          ok=0
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 1 --retry-all-errors --retry-delay 1 "$base/version.json?j1f=$GITHUB_SHA" -o /tmp/v.json; then
              live=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/v.json','utf8')).version)")
              if [ "$live" = "$expected" ]; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo 'J1F Preview deploy did not reach expected version'; exit 1; }
      - name: Mobile/desktop asset delivery
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          for p in /journal-ui.mjs /journal.css /journal-browser.mjs /journal-media-ui.mjs /lib/journal-client.mjs /lib/journal-supabase-transport.mjs; do
            code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "$base$p?j1f=$GITHUB_SHA")
            test "$code" = 200 || { echo "$p -> $code"; exit 1; }
          done
          curl --fail --silent --show-error --location "$base/?j1f=$GITHUB_SHA" -o /tmp/index.html
          grep -Fq 'journal-ui.mjs' /tmp/index.html
          grep -Fq 'journal.css' /tmp/index.html
          curl --fail --silent --show-error --location "$base/journal-ui.mjs?j1f=$GITHUB_SHA" -o /tmp/journal-ui.mjs
          grep -Fq '新增日誌' /tmp/journal-ui.mjs
          grep -Fq 'data-journal-new' /tmp/journal-ui.mjs
          grep -Fq 'data-journal-cancel-new' /tmp/journal-ui.mjs
          grep -Fq 'data-journal-back' /tmp/journal-ui.mjs
          ! grep -Fq 'data-journal-sync' /tmp/journal-ui.mjs
          grep -Fq 'placeholder="搜尋日誌"' /tmp/journal-ui.mjs
          grep -Fq '編輯日誌' /tmp/journal-ui.mjs
          ! grep -Fq 'data-journal-tab=' /tmp/journal-ui.mjs
          ! grep -Fq 'data-journal-trip-memory' /tmp/journal-ui.mjs
          ! grep -Fq 'journal-yearly.mjs' /tmp/index.html
          ! grep -Fq 'journal-media-preview-demo.mjs' /tmp/index.html
      - name: GPT gateway fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          url='https://preview--comfy-heliotrope-475c71.netlify.app/api/journal-gpt'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 -o /tmp/noauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"command":"createEntry","input":{"entryDate":"2026-09-07","summary":"must-not-write"},"mutationId":"11111111-1111-4111-8111-111111111111"}' "$url")
          test "$code" = 401 || { cat /tmp/noauth.json; exit 1; }
          grep -Fq 'missing_bearer_token' /tmp/noauth.json
      - name: MCP protected-resource and auth smoke
        shell: bash
        run: |
          set -euo pipefail
          base='https://preview--comfy-heliotrope-475c71.netlify.app'
          curl --fail --silent --show-error --location "$base/.well-known/oauth-protected-resource" -o /tmp/resource.json
          grep -Fq 'https://edjnwbticmkajwdqbgjz.supabase.co/auth/v1' /tmp/resource.json
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --retry-delay 1 -o /tmp/mcp-noauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$base/api/journal-mcp")
          test "$code" = 401 || { cat /tmp/mcp-noauth.json; exit 1; }
          grep -Fq 'invalid_token' /tmp/mcp-noauth.json
      - name: Result
        run: echo 'J1F PREVIEW MOBILE-FIRST JOURNAL + GPT/MCP AUTH GATE = PASS'